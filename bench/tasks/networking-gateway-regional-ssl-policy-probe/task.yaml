# Skill-guidance probe for gke-service-networking: enforcing a minimum TLS
# version on a regional Gateway. Gateway API attaches the SSL policy through a
# GCPGatewayPolicy (FrontendConfig is Ingress-only), and a regional Gateway
# class needs a regional SSL policy. No skill on main before the google/skills
# sync named GCPGatewayPolicy or SSL policies at all.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: networking-gateway-regional-ssl-policy-probe
name: A regional Gateway's SSL policy is regional and attached with GCPGatewayPolicy

owner: GinnyJI
domain: security

prompt: >-
  I run a regional external Gateway (gatewayClassName
  gke-l7-regional-external-managed) named shop-gw in namespace web, in
  us-central1. Security requires TLS 1.2 or later with the MODERN cipher
  profile on that load balancer. Give me the exact gcloud command to create
  the policy and the Kubernetes manifest that attaches it to the Gateway. Do
  not apply anything.
expected_output: >-
  gcloud compute ssl-policies create with --profile MODERN,
  --min-tls-version 1.2 and --region us-central1 (a regional Gateway needs a
  regional policy), then a GCPGatewayPolicy in namespace web whose
  spec.default.sslPolicy names it and whose targetRef points at Gateway
  shop-gw. FrontendConfig applies to Ingress only.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-policy-is-regional-and-attached-through-gcpgatewaypolicy
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["GCPGatewayPolicy", "sslPolicy", "ssl-policies create"]
      forbidden_patterns:
        # The Ingress mechanism carried over to a Gateway; a manifest, not prose.
        - "kind:\\s*frontendconfig"
        # A create command, followed across backslash continuations, that never
        # passes --region: a global policy. A report-wide "--region" would be
        # met by the proxy-only subnet command the skill also asks for.
        - '(^|\n)\s*(\$\s*)?gcloud compute ssl-policies create(?:(?!--region)[^\n\\]|\\(?!\n))*(?:\\\n(?:(?!--region)[^\n\\]|\\(?!\n))*)*(?:\n|$)'
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
