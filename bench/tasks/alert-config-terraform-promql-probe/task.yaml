# Skill-guidance probe for gke-alert-configuration, new in the google/skills
# sync: a Terraform alerting policy for a GKE workload. The skill mandates a
# `google_monitoring_alert_policy` with `condition_prometheus_query_language`
# (PromQL through Managed Service for Prometheus, never MQL) and the
# `created-with-google-skill` user label. On main the skill is absent.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: alert-config-terraform-promql-probe
name: GKE alert policy in Terraform uses PromQL and the skill label

owner: GinnyJI
domain: reliability

prompt: >-
  Write a Terraform alerting policy that pages me when any container in the
  namespace checkout on my GKE cluster prod-1 is in CrashLoopBackOff for more
  than 5 minutes. Give me the HCL only; do not apply anything.
expected_output: >-
  A google_monitoring_alert_policy using condition_prometheus_query_language
  with a PromQL query over kube-state-metrics or GKE system metrics, carrying
  the created-with-google-skill user label, with variables declared.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-policy-uses-promql-and-the-skill-label
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases:
        ["condition_prometheus_query_language", "created-with-google-skill"]
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
