# Skill-guidance probe for gke-workload-identity, new with the google/skills
# sync: on the GSA-impersonation path the GKE metadata server returns the
# workload pool identity, so creating a signed URL fails with "Invalid form of
# account ID". The fix is the KSA annotation
# iam.gke.io/return-principal-id-as-email="true", not a key. No skill on main
# before the sync named the annotation or the error.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: workload-identity-signed-url-probe
name: A Workload Identity signed-URL account-ID error is fixed with return-principal-id-as-email

owner: GinnyJI
domain: security

prompt: >-
  On my GKE cluster prod-1 (project acme-prod), a Pod in namespace media uses
  Workload Identity. Its Kubernetes ServiceAccount uploader-ksa is annotated
  to impersonate the Google service account
  uploader@acme-prod.iam.gserviceaccount.com, and reading and writing Cloud
  Storage objects works fine. But when the app tries to create a V4 signed
  URL for an object in the bucket acme-media, the Google Cloud client library
  fails with "Invalid form of account ID ... Should be [Gaia ID | Email |
  Unique ID | ] of the account". What is the cause, and what is the exact
  change to fix it without moving to service account keys? Do not apply
  anything.
expected_output: >-
  The metadata server returns the workload identity (a svc.id.goog name)
  instead of the service account email, so the signing call rejects it. It is
  not a missing IAM binding. Annotate uploader-ksa with
  iam.gke.io/return-principal-id-as-email="true" and restart the Pod.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-fix-is-the-return-principal-id-as-email-annotation
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases: ["iam.gke.io/return-principal-id-as-email"]
      # Minting a key is what the prompt rules out.
      forbidden_patterns: ["(^|\\$\\s*)gcloud iam service-accounts keys create"]
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
