# Skill-guidance probe for gke-compute-classes: keeping ComputeClass active
# migration from evicting a canary's new pods mid-rollout. The synced skill
# says to guard the green version with its own PodDisruptionBudget
# (maxUnavailable: 0, selected by version: green) and relax it after cutover,
# and not to use a safe-to-evict "false" pod-template annotation: changing the
# template restarts every pod of the Deployment, so taking the annotation off
# at 100% traffic rolls the whole green fleet. The skill on main before the
# google/skills sync only warned that maxUnavailable: 0 PDBs "permanently
# block" active migration, and GKE's active-migration docs list the
# annotation as a way to block eviction, so main is pointed at the annotation.
#
# The objective check rests on what the answer must contain: the
# version-scoped PDB and the reason the annotation is wrong (a template change
# rolls the pods). It does not forbid the annotation: a regex over the
# normalized report cannot tell a recommended annotation from one quoted to
# warn against it, so a forbidden pattern either fails correct answers or
# misses line-continued and inline forms.
#
# Planted defect required: none. deployer: noop, no fixture, no cluster read.
#
# Isolation class: read-only (no cluster touched at all).
# Tier: nightly (hack/eval/nightly-cases.txt).
id: compute-class-canary-active-migration-pdb-probe
name: A canary under ComputeClass active migration is guarded by a version-scoped PDB, not a pod-template annotation

owner: GinnyJI
domain: capacity

prompt: >-
  Our Deployment shop-green (pods labelled app: shop, version: green) runs on
  a ComputeClass with activeMigration.optimizeRulePriority: true. We shift
  traffic to it 10% -> 30% -> 60% -> 100% over a few hours, and active
  migration keeps evicting green pods while they warm up. We want the green
  pods left alone only until green takes 100% of traffic, then active
  migration should resume. The team's plan is to add
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false" to shop-green's pod
  template and remove it after cutover. Is that the right mechanism? Give the
  exact manifest you would use instead, if any, and what to change after
  cutover. Load the relevant installed gke-* skill and answer from it before
  searching documentation. Do not apply anything.
expected_output: >-
  No: adding or removing the annotation in the pod template changes the
  template hash and rolls every shop-green pod, so removing it at 100%
  traffic restarts the whole green fleet. Instead create a standalone
  PodDisruptionBudget with maxUnavailable: 0 selecting app: shop, version:
  green before the rollout; active migration goes through the Eviction API
  and is refused while it is in place. After cutover, patch the PDB to the
  normal budget (for example maxUnavailable: 25%) so active migration
  resumes, with no pod restarts.
infrastructure:
  deployer: noop
validated: false

verification_spec:
  - name: the-canary-is-guarded-by-a-version-scoped-pdb
    role: objective
    mode: assert
    check:
      type: all
      checks:
        - type: report_contains
          required_phrases: ["PodDisruptionBudget", "maxUnavailable: 0"]
          # Label values are often quoted in generated manifests.
          any_of_patterns: ["version:\\s*[\"']?green"]
        # The reason the annotation is wrong: a template change rolls the
        # pods. Bare "restart" is not enough; "no pod restarts" belongs to
        # the PDB half of a correct answer.
        - type: report_contains
          any_of_patterns:
            [
              "rolls? (out )?(every|all|the)",
              "rolling (update|restart|replacement)",
              "(triggers?|causes?|starts?) a (new )?(rollout|rolling)",
              "template[- ]hash",
              "new replicaset",
              "re-?creat(e|es|ing) (every|all|the)",
              "restart(s|ing)? (every|all|the)",
              "re-?roll",
            ]
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # Same delegation-boundary safeguard as knowledge-grounding-sources-probe.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  - name: no-worker-spends-an-answer-query-call
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # The quota-limited Developer Knowledge tool the personas forbid; see
        # knowledge-grounding-sources-probe for why both spellings.
        - type: tool_called
          scope: workers
          tool_names:
            [
              "mcp__developer_knowledge__answer_query",
              "mcp_developer_knowledge_answer_query",
            ]
